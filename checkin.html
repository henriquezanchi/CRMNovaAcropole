<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05433b">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://eovgljcowblwoxmobeno.supabase.co; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Check-in</title>
<link rel="icon" href="img/logo-nova-acropole.png">
<link rel="stylesheet" href="css/recepcao.css">
</head>
<body class="pagina-checkin">
<header class="topo">
  <img src="img/logo-nova-acropole.png" alt="" class="logo">
  <div class="topo-txt">
    <p class="marca">Nova Acrópole</p>
    <h1 id="titulo">Check-in</h1>
  </div>
</header>
<main class="tela checkin">
  <section id="passoForm">
    <nav class="abas abas2" role="tablist">
      <button type="button" role="tab" data-modo="checkin" aria-selected="true">Já me inscrevi</button>
      <button type="button" role="tab" data-modo="inscrever" aria-selected="false">Ainda não me inscrevi</button>
    </nav>

    <form id="formCheckin" autocomplete="on">
      <h2>Faça seu check-in</h2>
      <p class="sub">Informe o celular e o primeiro nome que você usou na inscrição.</p>
      <label>Celular com DDD <input id="ckCelular" class="cel" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(62) 99999-9999" maxlength="20"></label>
      <label>Primeiro nome <input id="ckNome" autocomplete="given-name" autocapitalize="words" placeholder="Ex.: Maria" maxlength="60"></label>
      <button type="submit" class="btn principal largo" id="ckBotao">Fazer check-in</button>
      <p id="ckMsg" class="erro" role="alert"></p>
    </form>

    <form id="formInscrever" autocomplete="on" hidden>
      <h2>Inscreva-se agora</h2>
      <p class="sub">Sua inscrição já vale como check-in.</p>
      <label>Nome e sobrenome <input id="inNome" autocomplete="name" autocapitalize="words" maxlength="120"></label>
      <label>Celular com DDD (WhatsApp) <input id="inCelular" class="cel" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(62) 99999-9999" maxlength="20"></label>
      <label>E-mail <input id="inEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" maxlength="120"></label>
      <label class="ck-opcao"><input id="inInteresse" type="checkbox"> Quero receber informações sobre o Curso de Filosofia</label>
      <button type="submit" class="btn principal largo" id="inBotao">Inscrever e fazer check-in</button>
      <p id="inMsg" class="erro" role="alert"></p>
    </form>
  </section>

  <section id="passoPasse" hidden>
    <p class="ck-grande" id="psBoasVindas">Boas-vindas!</p>
    <p class="sub centro" id="psTexto">Check-in feito. Bom evento!</p>
    <div class="ck-passe">
      <div id="psQr" class="ck-qr"></div>
      <p class="ck-passe-nome" id="psNome"></p>
      <p class="ck-passe-info" id="psInfo"></p>
    </div>
    <p class="sub centro">Este é o seu passe. Se a segurança pedir, mostre esta tela. Para garantir, tire um print.</p>
    <button type="button" id="psOutro" class="btn secundario largo">Fazer check-in de outra pessoa</button>
  </section>
</main>
<script src="js/checkin.js"></script>
</body>
</html>

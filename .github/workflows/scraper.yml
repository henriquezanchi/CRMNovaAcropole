name: Scraper Ulisses/Mercúrio

# Mercúrio roda 100% headless, sem bloqueio (confirmado em teste real) —
# por isso já dá pra agendar sozinho, todo dia, sem precisar de ninguém
# (ver `schedule:` abaixo). O Ulisses continua manual (Cloudflare barra
# IP de datacenter, ver comentário no passo abaixo) — pra isso, use o
# modo local/assistido (`npm run ulisses-local` na sua máquina de
# confiança) sempre que precisar reimportar de verdade.
on:
  workflow_dispatch:
  # O `schedule:` do GitHub Actions foi REMOVIDO daqui de propósito
  # (2026-09-10) — comprovadamente pouco confiável no plano gratuito: 2
  # dias seguidos com ~4h40 de atraso, e um dia em que simplesmente não
  # disparou (confirmado no histórico real de runs via API do GitHub, não
  # suposição). O disparo diário às 05:00 Brasília agora é feito por um
  # cron job DENTRO do Supabase (pg_cron + pg_net, ver
  # migracao_agendamento_mercurio_pgcron.sql), que chama a Edge Function
  # `scraper-disparar` — ela é quem aciona este workflow via
  # `workflow_dispatch`. O agendador do Postgres é muito mais preciso que
  # a fila compartilhada de `schedule:` de contas gratuitas do Actions.

jobs:
  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CREDENCIAIS_SCRAPER_CHAVE: ${{ secrets.CREDENCIAIS_SCRAPER_CHAVE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # < 22 não tem WebSocket nativo, e o cliente do Supabase precisa disso

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador (Chromium)
        run: npx playwright install --with-deps chromium

      # Pausado por decisão explícita (2026-09-06): o Cloudflare na frente
      # do acropolebrasil.com.br barra qualquer acesso vindo do IP de
      # datacenter do GitHub Actions com um challenge "Verify you are
      # human" — nunca chega nem no Auth0. Não é um bug de código, é uma
      # proteção deliberada contra automação; não vamos tentar contornar.
      # Ulisses segue no fluxo manual (planilha) até decidirmos rodar isso
      # de um IP residencial/self-hosted, ou conseguirmos allowlist com
      # quem administra o site. Ver CLAUDE.md, seção do scraper. Pra
      # reativar, é só apagar o `if: false` abaixo.
      - name: Ulisses — login + exportar Inscrições, catálogo de eventos e comparecimento (todas as filiais)
        if: false
        run: node ulisses.js
        continue-on-error: true

      - name: Mercúrio — login + exportar Ativos e Inativos (todas as filiais)
        run: node mercurio.js
        continue-on-error: true

      - name: Guardar prints de erro (se algum passo falhou)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: scraper/debug/
          if-no-files-found: ignore

      - name: Guardar arquivos exportados (CSV/JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-exports
          path: scraper/exports/
          if-no-files-found: ignore

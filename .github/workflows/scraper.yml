name: Scraper Mercúrio

# Só o Mercúrio roda aqui — o Ulisses NUNCA rodou neste workflow de
# verdade (Cloudflare bloqueia IP de datacenter, ver comentário que
# existia aqui antes) e o passo dele foi REMOVIDO por completo
# (2026-09-10, pedido do usuário: "quero um scraper só para o mercúrio, e
# um só para o ulisses" — o Ulisses já vive 100% separado, em
# `ulisses-local.js`, rodado manualmente na máquina de confiança do
# usuário; deixar aqui um passo sempre-pulado (`if: false`) só confundia,
# sugerindo uma dependência que nunca existiu).
on:
  workflow_dispatch:
    inputs:
      filial:
        description: 'Rodar só 1 filial (trecho do nome, ex: "Garavelo") — vazio roda todas'
        required: false
        default: ''
  # O `schedule:` do GitHub Actions foi REMOVIDO daqui de propósito
  # (2026-09-10) — comprovadamente pouco confiável no plano gratuito: 2
  # dias seguidos com ~4h40 de atraso, e um dia em que simplesmente não
  # disparou (confirmado no histórico real de runs via API do GitHub, não
  # suposição). O disparo diário às 05:00 Brasília agora é feito por um
  # cron job DENTRO do Supabase (pg_cron + pg_net, ver
  # migracao_agendamento_mercurio_pgcron.sql), que chama a Edge Function
  # `scraper-disparar` — ela é quem aciona este workflow via
  # `workflow_dispatch`. O agendador do Postgres é muito mais preciso que
  # a fila compartilhada de `schedule:` de contas gratuitas do Actions.

# GRAVÍSSIMO, achado em produção (2026-09-10): 2+ disparos concorrentes
# (clique duplicado no CRM, sem o lock de localStorage que existe hoje +
# o cron diário caindo no meio) fizeram 2-3 sessões do Mercúrio rodarem
# SIMULTANEAMENTE, todas logadas com a MESMA credencial compartilhada
# (Matrícula/Senha, `sistema='mercurio'`, `filial='GLOBAL'` no cofre — só
# existe 1 login pra todas as filiais). Evidência real, achada consultando
# `log_atividade`: uma importação com `enviados=117`/`alunoAtivo=33`/
# `exAluno=84` (a ASSINATURA EXATA de Barra do Garças) foi gravada com
# `filial='Goiânia - Jardim América'` — ou seja, uma sessão concorrente
# contaminou o "filial atual" da outra no meio da navegação, mesmo cada
# sessão rodando em runners/browsers totalmente isolados (só a CONTA do
# Mercúrio é compartilhada — é bem provável que a sessão do lado do
# Mercúrio, server-side, não isole bem 2 logins simultâneos da MESMA
# matrícula). Isso é EXATAMENTE a classe de bug já documentada como "Bug
# real #4 GRAVÍSSIMO" (índice de link stale) — só que a causa raiz real
# nunca era o índice ficar stale sozinho, era SEMPRE concorrência (2
# sessões pisando uma na outra), e o índice era só o sintoma mais fácil de
# enxergar. `concurrency` do GitHub Actions garante que só 1 execução
# deste workflow roda por vez — qualquer disparo novo enquanto outro já
# está rodando CANCELA o anterior (nunca deixa 2 ao mesmo tempo). Resolve
# na raiz, sem precisar confiar em nenhum lock do lado do CRM/navegador
# (que só protege contra clique duplicado NO MESMO navegador — não contra
# o cron diário, outro dispositivo, ou outra aba).
concurrency:
  group: scraper-mercurio
  cancel-in-progress: true

jobs:
  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CREDENCIAIS_SCRAPER_CHAVE: ${{ secrets.CREDENCIAIS_SCRAPER_CHAVE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # < 22 não tem WebSocket nativo, e o cliente do Supabase precisa disso

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Mercúrio — login + exportar Ativos e Inativos
        env:
          FILTRO_FILIAL: ${{ github.event.inputs.filial }}
        run: node mercurio.js
        continue-on-error: true

      - name: Guardar prints de erro (se algum passo falhou)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: scraper/debug/
          if-no-files-found: ignore

      - name: Guardar arquivos exportados (CSV/JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-exports
          path: scraper/exports/
          if-no-files-found: ignore
